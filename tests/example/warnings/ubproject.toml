# ---------------------------------------------------------------------------
# sphinx-mounts warning showcase
# ---------------------------------------------------------------------------
#
# Every warning this extension can emit, one commented-out [[mounts]] block
# per warning. Uncomment the [[mounts]] lines of ONE block at a time (keep
# the explanation comments above them) and rebuild to see its warning in
# isolation; with all blocks commented the build is completely clean.
#
# Build from this directory with:
#
#   sphinx-build -b html . _build/html
#
# or add ``-W`` to turn each warning into a build failure (warnings as
# errors). Warnings are typed ``mounts.<subtype>`` and can be suppressed
# via ``suppress_warnings`` in conf.py — see the extension's docs for the
# full list.

# 1. mounts.docname_conflict
#    The mount would shadow a docname already provided by the host project:
#    bundles/conflicts/index.rst collides with the host's own index.rst
#    because this mount has no mount_at (a root mount). The WHOLE mount is
#    skipped — nothing is mounted, so no orphaned docs follow.
# [[mounts]]
# dir = "bundles/conflicts"

# 2. mounts.missing_path
#    The configured dir does not exist on disk (bundles/absent is not
#    checked in). The whole mount is skipped, so a build whose upstream
#    bundle is absent (e.g. CI that has not run the Bazel build yet) can
#    still proceed.
# [[mounts]]
# dir = "bundles/absent"
# mount_at = "_generated/absent"

# 3. mounts.unknown_suffix
#    A file-list entry has no extension registered in Sphinx's
#    source_suffix (``.adoc`` is not parsed). The whole mount is skipped;
#    add a parser extension (e.g. myst_parser for ``.md``) or remove the
#    file from the list.
# [[mounts]]
# files = ["bundles/suffix/notes.adoc"]
# mount_at = "_generated/suffix"

# 4. mounts.mount_at_occupied
#    strict_mount_at = true, but the host already has a directory at the
#    mount point (the checked-in _generated/occupied/). An occupied mount
#    point means the bundle cannot be attached without modifying the host,
#    so the whole mount is skipped.
# [[mounts]]
# dir = "bundles/conflicts"
# mount_at = "_generated/occupied"
# strict_mount_at = true

# 5. mounts.attach_to_missing
#    attach_to names a docname that does not exist in the project, so
#    nothing is wired into a host toctree. This mount is empty
#    (bundles/empty holds only non-source files), so the demo shows exactly
#    this warning; a real mount would additionally report its docs as not
#    included in any toctree (toc.not_included) unless the host references
#    them.
# [[mounts]]
# dir = "bundles/empty"
# mount_at = "_generated/attached"
# attach_to = "no_such_doc"

# 6. mounts.toctree_index
#    attach_to's toctree_index exceeds the number of toctrees in the
#    attach_to document (the host index has one toctree), so the mount is
#    left unwired. Because nothing references its doc, Sphinx additionally
#    reports it as not included in any toctree (toc.not_included) —
#    reference the doc from the host to see only the mounts.toctree_index
#    warning.
# [[mounts]]
# dir = "bundles/single"
# mount_at = "_generated/wired"
# attach_to = "index"
# toctree_index = 3

# 7. mounts.path_escape
#    A mounted doc references a file outside its bundle root:
#    bundles/escape/index.rst literalincludes ../secret.txt, which lives in
#    bundles/, not in bundles/escape/. With path_check = "warn" this is a
#    warning; the default "error" would fail the build. attach_to wires the
#    entry doc into the host toctree, so no orphan noise appears.
# [[mounts]]
# dir = "bundles/escape"
# mount_at = "_generated/escape"
# attach_to = "index"
# path_check = "warn"
